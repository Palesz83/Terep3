[project]
name = "terep3"
version = "0.1.0"
description = "A 3D off-road driving game"
readme = "README.md"
authors = [
    { name = "Gabor Pal", email = "gabor.pal.ext@siemens.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "panda3d",
    "pillow",
    "ursina",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
